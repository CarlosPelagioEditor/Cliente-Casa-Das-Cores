<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa das Cores - Tintas e Acabamentos</title>
    <!-- Tailwind CSS para design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK v9 Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Cabeçalho -->
    <header class="bg-amber-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Casa das Cores</h1>
            <button id="auth-btn" onclick="toggleLogin()" class="bg-white text-amber-700 px-4 py-2 rounded-lg font-semibold text-sm shadow hover:bg-amber-50 transition">
                Entrar / Proprietário
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md p-6 text-center mb-8">
            <h2 id="store-title" class="text-2xl font-bold mb-2">Bem-vindo à Casa das Cores</h2>
            <p id="store-desc" class="text-gray-600 mb-6">Sua loja completa de tintas e acabamentos em Jaguaruna.</p>
            
            <div id="contact-buttons" class="flex flex-wrap justify-center gap-4">
                <a id="btn-whatsapp" href="https://wa.me/5548999999999" target="_blank" class="bg-green-600 text-white px-6 py-3 rounded-xl font-semibold shadow hover:bg-green-700 transition">
                    Chamar no WhatsApp
                </a>
            </div>
        </div>

        <!-- Painel de Edição do Proprietário (Oculto por padrão) -->
        <div id="admin-panel" class="hidden bg-amber-50 border border-amber-200 rounded-xl shadow-md p-6">
            <h3 class="text-lg font-bold text-amber-900 mb-4">Painel de Controle do Proprietário</h3>
            <form id="admin-form" onsubmit="saveData(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Título da Página</label>
                    <input type="text" id="input-title" class="w-full border rounded-lg px-3 py-2" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                    <textarea id="input-desc" class="w-full border rounded-lg px-3 py-2" rows="2" required></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Número do WhatsApp (Ex: 55489...)</label>
                    <input type="text" id="input-whatsapp" class="w-full border rounded-lg px-3 py-2" required>
                </div>
                <button type="submit" class="w-full bg-amber-600 text-white font-bold py-2 rounded-lg hover:bg-amber-700 transition">
                    Salvar Alterações no Site
                </button>
            </form>
        </div>
    </main>

    <!-- Script de Inicialização e Lógica -->
    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAJZ9w88QKJ9IkKwewwd1UhXXzo9lB-Qpg",
            authDomain: "cliente-casa-das-cores.firebaseapp.com",
            projectId: "cliente-casa-das-cores",
            storageBucket: "cliente-casa-das-cores.firebasestorage.app",
            messagingSenderId: "149903263600",
            appId: "1:149903263600:web:fe87de950513a9971ef1b5",
            measurementId: "G-4ETFJ8CM6L"
        };

        // Inicializa o Firebase com segurança
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        // E-mail autorizado do proprietário
        const ADMIN_EMAIL = "casadascoresjaguarunaadm@gmail.com";

        function toggleLogin() {
            const user = auth.currentUser;
            if (user) {
                auth.signOut().then(() => {
                    alert("Você saiu da conta.");
                });
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch((error) => {
                    alert("Erro no login: " + error.message);
                });
            }
        }

        // Monitora estado da autenticação
        auth.onAuthStateChanged((user) => {
            const btn = document.getElementById('auth-btn');
            const panel = document.getElementById('admin-panel');

            if (user && user.email === ADMIN_EMAIL) {
                btn.textContent = "Sair (Proprietário)";
                panel.classList.remove('hidden');
                loadAdminData();
            } else {
                if (user) {
                    alert("Este e-mail (" + user.email + ") não tem permissão de administrador.");
                    auth.signOut();
                }
                btn.textContent = "Entrar / Proprietário";
                panel.classList.add('hidden');
            }
        });

        // Carregar Dados do Firestore
        db.collection("configuracoes").doc("loja").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                if(data.title) document.getElementById('store-title').textContent = data.title;
                if(data.desc) document.getElementById('store-desc').textContent = data.desc;
                if(data.whatsapp) {
                    document.getElementById('btn-whatsapp').href = `https://wa.me/${data.whatsapp}`;
                }
            }
        });

        function loadAdminData() {
            db.collection("configuracoes").doc("loja").get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('input-title').value = data.title || '';
                    document.getElementById('input-desc').value = data.desc || '';
                    document.getElementById('input-whatsapp').value = data.whatsapp || '';
                }
            });
        }

        function saveData(e) {
            e.preventDefault();
            const title = document.getElementById('input-title').value;
            const desc = document.getElementById('input-desc').value;
            const whatsapp = document.getElementById('input-whatsapp').value;

            db.collection("configuracoes").doc("loja").set({
                title, desc, whatsapp
            }, { merge: true }).then(() => {
                alert("Dados salvos com sucesso no banco de dados!");
            }).catch((error) => {
                alert("Erro ao salvar: " + error.message);
            });
        }
    </script>
</body>
</html>
