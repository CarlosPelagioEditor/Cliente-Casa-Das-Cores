  <!-- Escudo defensivo global contra erros de serialização de terceiros -->
  <script>
    (function() {
      var _orig = JSON.stringify;
      JSON.stringify = function(val, replacer, space) {
        var seen = new WeakSet();
        var safe = function(k, v) {
          if (typeof v === 'object' && v !== null) {
            if (seen.has(v)) return '[Circular]';
            seen.add(v);
          }
          return typeof replacer === 'function' ? replacer(k, v) : v;
        };
        try {
          return _orig.call(JSON, val, safe, space);
        } catch (e) {
          return '"{}"';
        }
      };
    })();

    window.addEventListener('error', function(e) {
      if (!e) return true;
      var msg = e.message || '';
      if (msg.indexOf('Script error') !== -1 || msg.indexOf('circular structure') !== -1) {
        e.preventDefault();
        e.stopPropagation();
        return true;
      }
    }, true);
  </script>
